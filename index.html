<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collezione Pokémon</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#7c5cff">
<style>
:root{--bg:#f4f3fb;--card:#fff;--ink:#1f2033;--sub:#6b6d85;--ac:#7c5cff;--ac2:#ff5c8a;--line:#e6e4f5;--ok:#33c481;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#15151f;--card:#1f2030;--ink:#f1f1fa;--sub:#9a9ab3;--line:#33344a}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 40px}h1{font-size:1.4rem;margin:4px 0 12px}
.sub{color:var(--sub);font-size:.8rem;margin-top:6px}
button,select,input,.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;cursor:pointer}
input[type=search]{flex:1;min-width:150px;cursor:text}
.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{flex:1}
.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pb,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.pb{position:sticky;top:env(safe-area-inset-top,0);z-index:5}
.pt{display:flex;justify-content:space-between;margin-bottom:8px}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
#bf{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.card.ck{border-color:var(--ok)}
.art{position:relative;aspect-ratio:5/7;border-radius:8px;background:var(--line);overflow:hidden;cursor:pointer}
.art img{width:100%;height:100%;object-fit:cover;display:block}.card:not(.ck) .art img{opacity:.45;filter:grayscale(.8)}
.dup{position:absolute;top:4px;left:4px;font-size:.65rem;background:var(--ac2);color:#fff;padding:2px 5px;border-radius:6px;font-weight:700}
.num{font-size:.65rem;color:var(--sub);margin-top:4px}.name{font-size:.72rem;min-height:2.1em;line-height:1.15}
.st{display:flex;align-items:center;justify-content:center;gap:8px}.st button{padding:2px 9px}
h2{font-size:.95rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px solid var(--line)}
</style></head><body><div class="wrap">
<h1>🐾 Collezione Pokémon</h1>
<div class="tabs" id="tabs"></div>
<div class="pb"><div class="pt"><span>Progressi: <b id="pt">0/0</b></span><span id="pp">0%</span></div><div class="bar"><div id="bf"></div></div></div>
<div class="controls"><input type="search" id="q" placeholder="Cerca per nome o numero…">
<select id="f"><option value="all">Tutte</option><option value="have">Possedute</option><option value="missing">Mancanti</option><option value="dup">Doppie</option></select></div>
<div class="grid" id="g"></div>
<div class="box" style="margin-top:14px"><h2>🔁 Le tue doppie <button id="sh">📋 Copia</button></h2><div id="dl"></div></div>
<div class="box"><h2>💾 Backup</h2>
<button id="ex">Esporta JSON</button> <label class="btn">Importa JSON o CSV<input type="file" id="im" accept=".json,.csv" hidden></label> <button id="rs" style="color:var(--ac2)">Azzera set</button>
<div class="sub">Le quantità restano su questo dispositivo: fai un backup ogni tanto. Il CSV esportato dalla vecchia checklist si importa nella scheda aperta. Immagini e dati da TCGdex (open source).</div></div>
</div>
<script>
const SETS={jtg:{id:'sv09',name:'Avventure Insieme'},bp:{id:'me05',name:'Buio Pesto'}};
const $=i=>document.getElementById(i),LS=localStorage;
let cur=LS.getItem('pkm-tab')||'jtg',cards=[],state={};
try{state=JSON.parse(LS.getItem('pkm-q'))||{}}catch(e){}
const save=()=>{try{LS.setItem('pkm-q',JSON.stringify(state))}catch(e){}};
const Q=()=>state[cur]||(state[cur]={});
async function load(k){
  const id=SETS[k].id,ck='pkm-cards-'+id,ser=id.replace(/\d.*/,'');
  try{const c=JSON.parse(LS.getItem(ck));if(c&&c.length)return c}catch(e){}
  for(const l of['it','en']){try{
    const r=await fetch(`https://api.tcgdex.net/v2/${l}/sets/${id}`);if(!r.ok)continue;
    const s=await r.json();
    const list=(s.cards||[]).map(c=>({n:String(+c.localId||c.localId),name:c.name||'?',
      img:c.image?c.image+'/low.webp':`https://assets.tcgdex.net/${l}/${ser}/${id}/${c.localId}/low.webp`}));
    if(list.length){try{LS.setItem(ck,JSON.stringify(list))}catch(e){}return list}
  }catch(e){}}
  return[];
}
function tabs(){$('tabs').innerHTML='';for(const k in SETS){const b=document.createElement('button');
  b.textContent=SETS[k].name;b.className=k===cur?'on':'';b.onclick=()=>go(k);$('tabs').appendChild(b)}}
async function go(k){cur=k;LS.setItem('pkm-tab',k);cards=[];tabs();render();const c=await load(k);if(cur===k){cards=c;render()}}
function render(){
  const q=$('q').value.trim().toLowerCase(),f=$('f').value,S=Q(),g=$('g');g.innerHTML='';
  if(!cards.length)g.innerHTML='<div class="sub">Caricamento carte… (al primo avvio serve internet)</div>';
  cards.forEach(c=>{
    const o=S[c.n]||0;
    if(q&&!(c.name.toLowerCase().includes(q)||c.n.includes(q)))return;
    if((f==='have'&&!o)||(f==='missing'&&o)||(f==='dup'&&o<2))return;
    const d=document.createElement('div');d.className='card'+(o?' ck':'');
    d.innerHTML=`<div class="art"><img loading="lazy" alt="" src="${c.img}">${o>1?`<span class="dup">×${o}</span>`:''}</div><div class="num">#${c.n}</div><div class="name"></div><div class="st"><button class="d">−</button><b>${o}</b><button class="i">+</button></div>`;
    d.querySelector('.name').textContent=c.name;
    const im=d.querySelector('img');
    im.onerror=()=>{if(!im.dataset.r&&im.src.includes('/it/')){im.dataset.r=1;im.src=im.src.replace('/it/','/en/')}else im.style.visibility='hidden'};
    const set=v=>{S[c.n]=Math.max(0,v);save();render()};
    d.querySelector('.art').onclick=()=>set(o?0:1);
    d.querySelector('.d').onclick=()=>set(o-1);d.querySelector('.i').onclick=()=>set(o+1);
    g.appendChild(d)});
  const have=cards.filter(c=>S[c.n]>0).length,p=cards.length?Math.round(have/cards.length*100):0;
  $('pt').textContent=`${have}/${cards.length}`;$('pp').textContent=p+'%';$('bf').style.width=p+'%';
  const dups=cards.filter(c=>S[c.n]>1);
  $('dl').innerHTML=dups.length?'':'<div class="sub">Nessuna doppia: usa il “+” sulle carte.</div>';
  dups.forEach(c=>{const r=document.createElement('div');r.className='row';r.textContent=`#${c.n} · ${c.name}  ×${S[c.n]} (${S[c.n]-1} extra)`;$('dl').appendChild(r)});
}
$('q').oninput=render;$('f').onchange=render;
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('ex').onclick=()=>dl('collezione-pokemon-backup.json',JSON.stringify({v:1,q:state}),'application/json');
$('im').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const t=(await f.text()).replace(/^\uFEFF/,'');e.target.value='';
  try{
    if(t.trim()[0]==='{'){const j=JSON.parse(t);if(!j.q)throw 0;if(!confirm('Sostituire tutti i dati con il backup?'))return;state=j.q}
    else{if(!confirm(`Importare il CSV in "${SETS[cur].name}"?`))return;const S=state[cur]={};
      t.split(/\r?\n/).slice(1).forEach(l=>{const c=l.split(';'),n=parseInt(c[0]),qn=parseInt(c[4]);if(n&&qn>0)S[String(n)]=qn})}
    save();render()}catch(err){alert('File non valido.')}};
$('rs').onclick=()=>{if(confirm(`Azzerare "${SETS[cur].name}"?`)){delete state[cur];save();render()}};
$('sh').onclick=async()=>{
  const S=Q(),d=cards.filter(c=>S[c.n]>1);if(!d.length)return alert('Nessuna doppia segnata.');
  const t=`Le mie doppie — ${SETS[cur].name}\n`+d.map(c=>`#${c.n} ${c.name} — ×${S[c.n]} (${S[c.n]-1} extra)`).join('\n');
  if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);alert('Copiato!')}catch(e){prompt('Copia il testo:',t)}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go(cur);
</script></body></html>
